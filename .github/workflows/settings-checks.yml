name: Settings checks

# The launcher's settings pipeline is checked without Windows or the WPF build: the tables in the
# C# are compared with the Python copy of them, and the copy is exercised (label/table agreement,
# index bounds, card feature gates, AMD/NVIDIA interplay, launch environment per GPU tier, settings
# JSON round trip). See Tests/test_settings_*.py.

on:
  push:
    paths:
      - "AstroHybrid.App/AstroHybrid.App.csproj"
      - "AstroHybrid.App/Models/AppSettings.cs"
      - "AstroHybrid.App/Models/GameInfo.cs"
      - "AstroHybrid.App/Services/LauncherService.cs"
      - "AstroHybrid.App/Services/HardwareDetector.cs"
      - "AstroHybrid.App/ViewModels/MainWindowViewModel.cs"
      - "AstroHybrid.App/ViewModels/GraphicsSettingsViewModel.cs"
      - "Tools/hybrid/launcher/AstroBotLauncher.cs"
      - "AstroHybrid.App/Services/SettingsManager.cs"
      - "Tests/settings_model.py"
      - "Tests/test_settings_*.py"
      - ".github/workflows/settings-checks.yml"
  pull_request:
    paths:
      - "AstroHybrid.App/**"
      - "Tests/**"
      - ".github/workflows/settings-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every assembly the code uses must be referenced by the project file, and every .cs file must be
      # in <Compile Include>: an old-style .NET Framework project does not add either by itself, and
      # nothing here can compile the app to find out.
      - name: Project references and file list
        run: python Tests/test_project_references.py

      # Fails if Tests/settings_model.py has drifted from the C# it mirrors.
      - name: Tables in the C# and in settings_model.py agree
        run: python Tests/test_settings_tables.py

      # Exercises the pipeline: labels, indices, feature gates, AMD interplay, launch environment.
      - name: Settings pipeline
        run: python Tests/test_settings_model.py

      # Old settings files still load; the AMD fields persist.
      - name: Settings JSON round trip
        run: python Tests/test_settings_json.py

      # The settings file is written by both the app and the classic launcher: an interrupted save
      # must not lose it, and a recovery must never be silent.
      - name: Settings survive an interrupted save
        run: python Tests/test_settings_recovery.py

      - name: Install the C# grammar used by the checks below
        run: pip install tree_sitter tree_sitter_c_sharp

      # The three checks below need the grammar. They exit 77 rather than 0 if it is missing, so a
      # broken install step above fails the job instead of quietly passing it.

      # A {Binding} to a member the view model does not have fails silently in WPF.
      - name: XAML bindings resolve
        run: python Tests/test_xaml_bindings.py

      # Members, argument counts, enum values, literals and BCL names, checked without a .NET runtime.
      - name: C# semantics
        run: python Tests/test_csharp_semantics.py

      # Proves the checker above still catches an injected fault of each kind.
      - name: Semantic checker self-test
        run: python Tests/test_semantics_selftest.py
